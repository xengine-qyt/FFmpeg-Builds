name: Build FFmpeg nonfree-shared
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [win32, win64, winarm64]   # win32 先确认 variants/ 里是否存在
        version: ["9.0"]
    env:
      VARIANT: nonfree-shared
      EXACT_TAG: n9.0.2
    steps:
      - uses: actions/checkout@v7

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: 锁定版本为 ${{ env.EXACT_TAG }}
        run: |
          sed -i 's|GIT_BRANCH=".*"|GIT_BRANCH="${{ env.EXACT_TAG }}"|' addins/${{ matrix.version }}.sh
          cat addins/${{ matrix.version }}.sh

      - name: 检查配置文件
        run: |
          ls variants addins
          test -f "variants/${{ matrix.target }}-${VARIANT}.sh"
          test -f "addins/${{ matrix.version }}.sh"

      - name: 构建所有镜像(base / 工具链 / 依赖库)
        run: ./makeimage.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - name: 编译 FFmpeg 并打包
        run: ./build.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ env.EXACT_TAG }}-${{ matrix.target }}-${{ env.VARIANT }}
          path: artifacts/*
          retention-days: 1