name: Build FFmpeg nonfree-shared (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [win64, win32, winarm64]
        version: n9.0.2
    env:
      VARIANT: nonfree-shared
    steps:
      - uses: actions/checkout@v7

      - name: Check targets and variants
        run: |
          ls variants
          test -f "variants/${{ matrix.target }}-${VARIANT}.sh"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build image
        run: ./makeimage.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - name: Build FFmpeg
        run: ./build.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.version }}-${{ matrix.target }}-${{ env.VARIANT }}
          path: artifacts/*
          retention-days: 1