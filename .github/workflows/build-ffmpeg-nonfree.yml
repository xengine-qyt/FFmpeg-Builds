name: Build FFmpeg nonfree-shared From Scratch (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [win64, win32, winarm64]
        version: [9.0]
    env:
      VARIANT: nonfree-shared
      EXACT_TAG: n9.0.2
    steps:
      - uses: actions/checkout@v4

      - name: 1. 锁定版本为 n9.0.2
        run: |
          sed -i 's/GIT_BRANCH=".*"/GIT_BRANCH="${{ env.EXACT_TAG }}"/' addins/9.0.sh
          cat addins/9.0.sh

      - name: 2. 检查配置文件
        run: |
          ls variants
          test -f "variants/${{ matrix.target }}-${VARIANT}.sh"

      - name: 4. 从零编译通用基础镜像 (ffbuild/base)
        run: ./makeimage.sh base

      - name: 5. 从零编译交叉编译工具链 (ffbuild/base-${{ matrix.target }})
        run: ./makeimage.sh base-${{ matrix.target }}

      - name: 6. 从零编译所有第三方依赖库镜像
        run: ./makeimage.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - name: 7. 编译 FFmpeg 9.0.2 并打包
        run: ./build.sh ${{ matrix.target }} ${VARIANT} ${{ matrix.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.EXACT_TAG }}-${{ matrix.target }}-${{ env.VARIANT }}
          path: artifacts/*
          retention-days: 1